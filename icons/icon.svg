<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#121A33"/>
      <stop offset="1" stop-color="#070A14"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="34%" r="75%">
      <stop offset="0" stop-color="#FFE2B0"/>
      <stop offset=".45" stop-color="#FF9A3C"/>
      <stop offset="1" stop-color="#8A3A12"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset=".55" stop-color="#FF9A3C" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FF9A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A8CBE6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#A8CBE6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#A8CBE6" opacity=".7">
    <circle cx="70" cy="92" r="2.2"/><circle cx="440" cy="70" r="1.6"/>
    <circle cx="462" cy="408" r="2.4"/><circle cx="58" cy="430" r="1.4"/>
    <circle cx="410" cy="250" r="1.2"/><circle cx="118" cy="300" r="1.3"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#7C8DAE" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round" opacity=".85"/>
  <circle cx="256" cy="256" r="92" fill="url(#planet)"/>
  <!-- ship on the orbit ring, upper right -->
  <circle cx="369" cy="143" r="40" fill="url(#shipGlow)"/>
  <circle cx="369" cy="143" r="15" fill="#FFFFFF"/>
  <circle cx="369" cy="143" r="15" fill="none" stroke="#A8CBE6" stroke-width="4"/>
</svg>
